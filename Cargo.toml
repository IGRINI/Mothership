[workspace]
members = [
  "adapters/claude-agent",
  "adapters/codex",
  "adapters/openrouter",
  "crates/mothership-adapter-host",
  "crates/mothership-adapter-protocol",
  "crates/mothership-adapter-sdk",
  "crates/mothership-core",
  "crates/mothership-openai-responses",
  "crates/process-sandbox",
  "src-sidecar",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.2"
globset = "0.4"
ignore = "0.4"
process-wrap = { version = "9.1", features = ["tokio1"] }
regex = "1"
reqwest = { version = "0.13.3", features = ["blocking", "form", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
# Generates the TypeScript wire types from the Rust serde structs (see
# `src/shared/api/generated/`). `serde-compat` makes the derive read the existing
# serde attributes (rename_all / tag / content / rename / skip / default) so the
# emitted .ts mirrors the JSON exactly; `format` prettifies the output.
ts-rs = { version = "12", features = ["serde-compat", "format", "serde-json-impl"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2"
