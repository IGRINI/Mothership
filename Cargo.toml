[workspace]
members = [
  "adapters/codex",
  "adapters/openrouter",
  "crates/mothership-adapter-host",
  "crates/mothership-core",
  "crates/mothership-plugin-host",
  "crates/process-sandbox",
  "src-sidecar",
  "src-tauri",
]
# Guest plugin crates compile to wasm32-wasip2 as components; they must not be
# built for the host target, so they live outside the workspace.
exclude = [
  "plugins",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.2"
process-wrap = { version = "9.1", features = ["tokio1"] }
reqwest = { version = "0.13.3", features = ["blocking", "form", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2"
