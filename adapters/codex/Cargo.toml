[package]
name = "codex-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

# Self-contained: depends only on the adapter protocol SDK + raw crates. It does
# NOT depend on mothership-core — all Codex provider logic lives here, in the
# plugin.
[dependencies]
mothership-adapter-host = { path = "../../crates/mothership-adapter-host" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
url.workspace = true
anyhow.workspace = true
# Opens the OAuth URL in the default browser via the OS handler (ShellExecute on
# Windows, open/xdg-open elsewhere) — no fragile shelling out to `cmd`.
open = "5"
