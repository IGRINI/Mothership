<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07101a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Mothership</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #050a10;
        color: #dde6f0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .bootstrap-screen {
        position: relative;
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgb(29 95 214 / 12%), transparent 32%),
          #07101a;
      }

      .bootstrap-drag-region {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 48px;
        -webkit-app-region: drag;
        app-region: drag;
      }

      .bootstrap-panel {
        display: grid;
        justify-items: center;
        gap: 12px;
        color: #9fb1c4;
        font-size: 13px;
      }

      .bootstrap-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid #1d3d68;
        border-radius: 14px;
        background: #0b1724;
      }

      .bootstrap-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgb(116 161 236 / 22%);
        border-top-color: #74a1ec;
        border-radius: 999px;
        animation: bootstrap-spin 900ms linear infinite;
      }

      @keyframes bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="bootstrap-screen" data-bootstrap-screen>
        <div class="bootstrap-drag-region" data-tauri-drag-region></div>
        <div class="bootstrap-panel" role="status" aria-live="polite">
          <div class="bootstrap-mark">
            <div class="bootstrap-spinner" aria-hidden="true"></div>
          </div>
          <span>Starting Mothership...</span>
        </div>
      </div>
    </div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
