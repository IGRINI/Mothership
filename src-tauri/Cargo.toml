[package]
name = "mothership-app"
version.workspace = true
description = "Mothership desktop shell"
authors = ["Mothership"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mothership_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
# Thin client: depends on Core only for the wire protocol + shared DTO types.
# It does NOT depend on mothership-adapter-host — the sidecar owns adapters now.
mothership-core = { path = "../crates/mothership-core" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["image-png", "protocol-asset"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-shell.workspace = true
tokio.workspace = true

# The single-instance plugin is desktop-only (per its docs); its `init` does
# not exist on mobile targets, so scope the dependency to desktop.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
